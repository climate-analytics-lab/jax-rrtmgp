name: Run Unit Tests via Pytest

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage
          pip install -e ".[dev]"
      # One process per test file: the compiled programs of the radiation solves
      # (every g-point program, both solvers, both tables) are large, and a single
      # process over the whole suite accumulates them until the runner kills it
      # (exit 137). `-p` keeps each process's coverage data apart; they are
      # combined below.
      - name: Test with pytest
        run: |
          for f in $(find rrtmgp -name '*_test.py' | sort); do
            coverage run -p -m pytest -v -s "$f"
          done
          coverage combine
      - name: Generate Coverage Report
        run: |
          coverage report -m